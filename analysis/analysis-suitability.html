<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建设适宜性分析 - 分析模块</title>
  <style>
    body{margin:0;font-family:"Microsoft YaHei";background:#0b1316;color:#e9f3ef}
    .wrap{padding:16px}
    .top{display:flex;justify-content:space-between;align-items:center;border:1px solid #2b4a49;padding:10px 14px;background:#132224}
    .btn{color:#e9f3ef;text-decoration:none;border:1px solid #3d6a68;padding:6px 10px}
    .main{margin-top:12px;display:grid;grid-template-columns:320px 1fr;gap:10px}
    .card{border:1px solid #2b4a49;background:#132224;padding:12px}
    .map{height:460px;border:1px dashed #3d6a68;display:grid;place-items:center;color:#9fb7b0}
    .tag{display:inline-block;border:1px solid #3d6a68;padding:4px 8px;margin:4px 4px 0 0;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <b>分析模块 / 村庄建设适宜性分析</b>
      <a class="btn" href="./analysis-index.html">返回分析入口</a>
    </div>

    <div class="main">
      <div class="card">
        <h3>分析因子（示意）</h3>
        <span class="tag">DEM坡度</span>
        <span class="tag">低洼风险</span>
        <span class="tag">土地利用</span>
        <span class="tag">道路可达性</span>
        <span class="tag">水系缓冲</span>
        <h3 style="margin-top:14px;">输出结果</h3>
        <p>适建区：52%</p>
        <p>限制区：31%</p>
        <p>优化区：17%</p>
      </div>
      <div class="card">
        <h3>空间分区结果图</h3>
        <div class="map">这里接 SuperMap 适宜性分区图层（占位）</div>
      </div>
    </div>
  </div>
</body>
</html>
