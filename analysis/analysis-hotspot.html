<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>治理问题热点分析 - 分析模块</title>
  <style>
    body{margin:0;font-family:"Microsoft YaHei";background:#0b1316;color:#e9f3ef}
    .wrap{padding:16px}
    .top{display:flex;justify-content:space-between;align-items:center;border:1px solid #2b4a49;padding:10px 14px;background:#132224}
    .btn{color:#e9f3ef;text-decoration:none;border:1px solid #3d6a68;padding:6px 10px}
    .main{margin-top:12px;display:grid;grid-template-columns:1fr 340px;gap:10px}
    .card{border:1px solid #2b4a49;background:#132224;padding:12px}
    .map{height:460px;border:1px dashed #3d6a68;display:grid;place-items:center;color:#9fb7b0}
    ul{margin:8px 0 0 16px;color:#9fb7b0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <b>分析模块 / 治理问题热点分析</b>
      <a class="btn" href="./analysis-index.html">返回分析入口</a>
    </div>

    <div class="main">
      <div class="card">
        <h3>热点分布图</h3>
        <div class="map">这里接 SuperMap 核密度/聚类热点图（占位）</div>
      </div>
      <div class="card">
        <h3>重点片区清单（示意）</h3>
        <ul>
          <li>A片区：人居环境问题集中</li>
          <li>B片区：设施短板明显</li>
          <li>C片区：疑似违建点位较多</li>
        </ul>
        <h3 style="margin-top:14px;">建议动作</h3>
        <ul>
          <li>优先级1：A片区联合整治</li>
          <li>优先级2：B片区补齐公共服务</li>
          <li>优先级3：C片区核查执法</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
