<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三生指标评价 - 分析模块</title>
  <style>
    :root{
      --bg:#091215; --panel:rgba(14,28,31,.9); --line:rgba(136,190,185,.26);
      --text:#edf7f3; --muted:#9eb8b2; --cyan:#35d0c6; --green:#70d27b; --amber:#f4b44b; --violet:#b891ff;
    }
    *{box-sizing:border-box}
    body{margin:0;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:linear-gradient(135deg,#071113,#10211e 48%,#171817);}
    .wrap{padding:16px; min-height:100vh; display:grid; grid-template-rows:66px 1fr}
    header{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border:1px solid var(--line);background:rgba(13,32,31,.86)}
    .title{font-size:20px;font-weight:700}
    .back{color:var(--text);text-decoration:none;border:1px solid rgba(141,215,205,.35);padding:6px 10px;font-size:12px}
    .main{margin-top:10px;display:grid;grid-template-columns:320px 1fr 340px;gap:10px;min-height:0}
    .panel{border:1px solid var(--line);background:var(--panel);min-height:0}
    .hd{height:40px;padding:0 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .hd h3{margin:0;font-size:15px}
    .bd{padding:12px}
    .form-row{display:grid;gap:8px;margin-bottom:10px}
    label{font-size:12px;color:var(--muted)}
    input[type="range"]{width:100%}
    .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .box{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);padding:10px}
    .box b{display:block;font-size:21px;margin-top:6px}
    .map{
      height:100%; min-height:420px; border:1px dashed rgba(255,255,255,.15);
      display:grid; place-items:center; color:var(--muted); font-size:14px;
      background:linear-gradient(160deg, rgba(53,208,198,.08), transparent 35%), #0b1818;
    }
    .bar{height:8px;background:rgba(255,255,255,.08);margin-top:6px}
    .fill{height:100%}
    .btn{border:1px solid rgba(141,215,205,.35);background:rgba(11,27,28,.88);color:var(--text);padding:7px 10px;font-size:12px;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">分析模块 / 三生指标评价</div>
      <a class="back" href="./analysis-index.html">返回分析入口</a>
    </header>

    <section class="main">
      <article class="panel">
        <div class="hd"><h3>参数配置</h3><span style="color:#9eb8b2;font-size:12px">权重可调</span></div>
        <div class="bd">
          <div class="form-row">
            <label>生态权重：<span id="wEcoTxt">0.35</span></label>
            <input id="wEco" type="range" min="0" max="1" step="0.01" value="0.35">
          </div>
          <div class="form-row">
            <label>生活权重：<span id="wLiveTxt">0.30</span></label>
            <input id="wLive" type="range" min="0" max="1" step="0.01" value="0.30">
          </div>
          <div class="form-row">
            <label>产业权重：<span id="wIndTxt">0.35</span></label>
            <input id="wInd" type="range" min="0" max="1" step="0.01" value="0.35">
          </div>
          <button class="btn" id="recalcBtn">重新计算（演示）</button>
        </div>
      </article>

      <article class="panel">
        <div class="hd"><h3>评价结果空间分布</h3><span style="color:#9eb8b2;font-size:12px">专题图占位</span></div>
        <div class="bd">
          <div class="map">这里接 SuperMap 专题图层（乡镇/村庄三生评分分级渲染）</div>
        </div>
      </article>

      <article class="panel">
        <div class="hd"><h3>结果摘要</h3><span style="color:#9eb8b2;font-size:12px">自动刷新</span></div>
        <div class="bd">
          <div class="kpi">
            <div class="box"><span style="color:#9eb8b2;font-size:12px">综合得分</span><b id="totalScore">86.4</b></div>
            <div class="box"><span style="color:#9eb8b2;font-size:12px">评级</span><b id="levelTxt">良好</b></div>
          </div>

          <div style="margin-top:12px;font-size:12px;color:#9eb8b2">生态</div>
          <div class="bar"><div id="ecoBar" class="fill" style="width:88%;background:var(--green)"></div></div>

          <div style="margin-top:12px;font-size:12px;color:#9eb8b2">生活</div>
          <div class="bar"><div id="liveBar" class="fill" style="width:82%;background:var(--cyan)"></div></div>

          <div style="margin-top:12px;font-size:12px;color:#9eb8b2">产业</div>
          <div class="bar"><div id="indBar" class="fill" style="width:90%;background:var(--amber)"></div></div>

          <div style="margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6">
            说明：本页为汇报演示壳子，当前采用示意评分逻辑。后续可替换为真实指标模型与数据库计算结果。
          </div>
        </div>
      </article>
    </section>
  </div>

  <script>
    const base = { eco: 88, live: 82, ind: 90 };

    const dom = {
      wEco: document.getElementById("wEco"),
      wLive: document.getElementById("wLive"),
      wInd: document.getElementById("wInd"),
      wEcoTxt: document.getElementById("wEcoTxt"),
      wLiveTxt: document.getElementById("wLiveTxt"),
      wIndTxt: document.getElementById("wIndTxt"),
      totalScore: document.getElementById("totalScore"),
      levelTxt: document.getElementById("levelTxt"),
      ecoBar: document.getElementById("ecoBar"),
      liveBar: document.getElementById("liveBar"),
      indBar: document.getElementById("indBar"),
      recalcBtn: document.getElementById("recalcBtn")
    };

    function calc() {
      const we = parseFloat(dom.wEco.value);
      const wl = parseFloat(dom.wLive.value);
      const wi = parseFloat(dom.wInd.value);
      const sum = we + wl + wi || 1;
      const nwe = we / sum, nwl = wl / sum, nwi = wi / sum;
      const total = base.eco * nwe + base.live * nwl + base.ind * nwi;

      dom.wEcoTxt.textContent = we.toFixed(2);
      dom.wLiveTxt.textContent = wl.toFixed(2);
      dom.wIndTxt.textContent = wi.toFixed(2);
      dom.totalScore.textContent = total.toFixed(1);
      dom.levelTxt.textContent = total >= 85 ? "良好" : total >= 75 ? "中等" : "待提升";

      dom.ecoBar.style.width = base.eco + "%";
      dom.liveBar.style.width = base.live + "%";
      dom.indBar.style.width = base.ind + "%";
    }

    ["input","change"].forEach(evt=>{
      dom.wEco.addEventListener(evt, calc);
      dom.wLive.addEventListener(evt, calc);
      dom.wInd.addEventListener(evt, calc);
    });
    dom.recalcBtn.addEventListener("click", calc);
    calc();
  </script>
</body>
</html>
