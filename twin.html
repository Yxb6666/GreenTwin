<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字孪生场景模块</title>
  
  <link href="https://www.supermapol.com/earth/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
/* Inlined from css/twin.css */
/* twin.css */
:root {
  --bg-0: #080d0d;
  --bg-1: #0d1413;
  --panel: rgba(16, 24, 23, 0.58);
  --panel-2: rgba(16, 24, 23, 0.74);
  --line: rgba(181, 224, 212, 0.14);
  --line-soft: rgba(181, 224, 212, 0.08);
  --text: #e8f1ee;
  --text-soft: #9ab3aa;
  --brand-cyan: #35d0c6;
  --brand-green: #70d27b;
  --type-env: #e56b5d;
  --type-base: #f4b44b;
  --type-space: #35d0c6;
  --radius: 10px;
  --radius-sm: 8px;
  --shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
}

* { box-sizing: border-box; }

html, body {
  width: 100%; 
  height: 100%; 
  margin: 0; 
  overflow: hidden;
  font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: 
    radial-gradient(100% 90% at 50% 0%, rgba(53, 208, 198, 0.12), transparent 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
}

.twin-app {
  width: 100vw; 
  height: 100vh; 
  padding: 12px 14px;
  display: grid;
  grid-template-rows: 72px minmax(0, 1fr);
  gap: 10px;
}

.panel {
  min-height: 0; 
  border: 1px solid var(--line);
  background: var(--panel); 
  border-radius: var(--radius);
  backdrop-filter: blur(10px); 
  -webkit-backdrop-filter: blur(10px);
  box-shadow: var(--shadow);
}

/* ================= Header ================= */
.top-header {
  border: 1px solid var(--line); 
  border-radius: 12px; 
  background: var(--panel-2);
  display: grid; 
  grid-template-columns: 280px minmax(0, 1fr) 280px;
  align-items: center; 
  padding: 0 16px;
}
.header-title { text-align: center; }
.header-title h1 { margin: 0; font-size: clamp(22px, 1.65vw, 28px); font-weight: 600; letter-spacing: 1px; }
.header-title p { margin: 6px 0 0; color: var(--text-soft); font-size: 12px; }

.header-meta, .header-time { display: grid; gap: 5px; }
.header-time { justify-items: end; }
.meta-label { font-size: 12px; color: var(--text-soft); }
.header-meta strong, .header-time strong { font-size: 14px; font-weight: 600; }
.text-glow { color: var(--brand-cyan); text-shadow: 0 0 8px rgba(53,208,198,0.4); }

/* ================= Layout ================= */
.main-layout {
  min-height: 0; 
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr) 300px; 
  gap: 10px;
}
.left-panel, .right-panel, .center-panel {
  display: grid; 
  gap: 10px; 
  padding: 10px;
}
.left-panel { grid-template-rows: auto minmax(0, 1fr); }
.right-panel { grid-template-rows: auto minmax(0, 1fr); }
.center-panel { grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }

/* ================= Sections ================= */
.panel-section {
  border: 1px solid var(--line-soft); 
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.02); 
  display: flex; 
  flex-direction: column;
}
.section-head {
  height: 40px; 
  border-bottom: 1px solid var(--line-soft);
  display: flex; 
  align-items: center; 
  padding: 0 12px;
}
.section-head h2 { margin: 0; font-size: 13px; font-weight: 600; }

/* ================= 左侧：资产概览 ================= */
.overview-grid {
  padding: 10px; 
  display: grid; 
  grid-template-columns: repeat(2, 1fr); 
  gap: 6px;
}
.mini-stat {
  border: 1px solid var(--line-soft); 
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.025); 
  padding: 8px;
  transition: all 0.2s ease;
}
.mini-stat:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(53, 208, 198, 0.3);
}
.mini-stat span { font-size: 11px; color: var(--text-soft); }
.mini-stat strong { display: inline-block; margin-top: 6px; font-size: 20px; font-weight: 650; color: var(--brand-cyan); }
.mini-stat small { font-size: 11px; color: var(--text-soft); margin-left: 2px; }

/* ================= 左侧：图层开关 ================= */
.layer-scroll { padding: 10px; display: grid; gap: 8px; overflow: auto; }
.layer-toggle {
  display: flex; 
  align-items: center; 
  gap: 10px; 
  cursor: pointer;
  padding: 8px 10px; 
  border-radius: 6px; 
  border: 1px solid transparent;
  transition: background 0.2s;
}
.layer-toggle:hover { background: rgba(255,255,255,0.04); }
.layer-toggle input { display: none; }
.toggle-track {
  width: 32px; 
  height: 18px; 
  border-radius: 10px; 
  background: rgba(255,255,255,0.1);
  position: relative; 
  transition: background 0.3s;
}
.toggle-thumb {
  width: 14px; 
  height: 14px; 
  border-radius: 50%; 
  background: #fff;
  position: absolute; 
  top: 2px; 
  left: 2px; 
  transition: transform 0.3s;
}
.layer-toggle input:checked + .toggle-track { background: var(--brand-cyan); }
.layer-toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(14px); }
.layer-toggle span { font-size: 12px; }
.text-warn { color: var(--type-env); }

/* ================= 中间：三维地图区 ================= */
.map-toolbar { display: flex; gap: 8px; padding: 2px 2px 8px; }
.scene-btn {
  height: 32px; 
  padding: 0 14px; 
  border: 1px solid var(--line);
  border-radius: 7px; 
  background: rgba(255, 255, 255, 0.03);
  color: var(--text); 
  cursor: pointer; 
  font-size: 12px; 
  transition: all 0.2s;
}
.scene-btn:hover { border-color: rgba(53, 208, 198, 0.5); }
.scene-btn.active { border-color: var(--brand-cyan); background: rgba(53, 208, 198, 0.16); }

.map-wrap {
  flex: 1; 
  border: 1px solid var(--line-soft); 
  border-radius: 8px;
  position: relative; 
  overflow: hidden; 
  background: #0a1110;
}

/* Cesium 容器样式 */
#cesiumContainer { 
  width: 100%; 
  height: 100%; 
  display: block; 
}

/* 隐藏 Cesium 默认的 UI 组件，保持大屏清爽 */
.cesium-widget-credits,
.cesium-viewer-timelineContainer,
.cesium-viewer-bottom,
.cesium-viewer-animationContainer,
.cesium-viewer-fullscreenContainer,
.cesium-viewer-vrContainer {
  display: none !important;
}

.roam-tip {
  position: absolute; 
  top: 10px; 
  left: 10px; 
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--brand-cyan); 
  padding: 4px 10px; 
  border-radius: 4px;
  font-size: 12px; 
  color: var(--brand-cyan); 
  backdrop-filter: blur(4px);
  z-index: 99; /* 确保在3D球之上 */
  pointer-events: none;
  transition: border-color 0.3s;
}

/* ================= 右侧：视点漫游 ================= */
.roam-list { padding: 10px; display: grid; gap: 8px; overflow: auto; }
.roam-item {
  display: flex; 
  align-items: center; 
  gap: 12px; 
  padding: 10px;
  background: rgba(255,255,255,0.03); 
  border: 1px solid var(--line-soft);
  border-radius: 8px; 
  cursor: pointer; 
  text-align: left; 
  color: var(--text);
  transition: all 0.2s;
}
.roam-item:hover { 
  background: rgba(53,208,198,0.1); 
  border-color: rgba(53,208,198,0.3); 
  transform: translateX(2px); 
}
.roam-item .icon { font-size: 20px; font-style: normal; }
.roam-info h3 { margin: 0 0 4px 0; font-size: 13px; font-weight: 500; }
.roam-info p { margin: 0; font-size: 11px; color: var(--text-soft); }

/* ================= 右侧：雷达图 ================= */
.radar-container { flex: 1; min-height: 200px; padding: 10px; position: relative; }
#radarChart { width: 100%; height: 100%; display: block; }

/* ================= 滚动条美化 ================= */
.scroll-region::-webkit-scrollbar { width: 6px; }
.scroll-region::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 999px; }
.scroll-region::-webkit-scrollbar-thumb { background: rgba(150, 175, 167, 0.6); border-radius: 999px; }
.scroll-region { scrollbar-width: thin; scrollbar-color: rgba(150, 175, 167, 0.6) rgba(255, 255, 255, 0.05); }

/* ================= 响应式调整 (与governance保持一致) ================= */
@media (max-width: 1440px) {
  .main-layout { grid-template-columns: 260px minmax(0, 1fr) 280px; }
}

@media (max-width: 1180px) {
  .main-layout {
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  }
  .center-panel { grid-column: 1; grid-row: 1 / 3; }
  .left-panel { grid-column: 2; grid-row: 1; }
  .right-panel { grid-column: 2; grid-row: 2; }
}
  </style>
</head>
<body>
  <div class="twin-app">
    <header class="top-header">
      <div class="header-meta">
        <span class="meta-label">三维引擎状态</span>
        <strong id="runStatus" class="text-glow">SuperMap WebGL 运行中</strong>
      </div>
      <div class="header-title">
        <h1>数字孪生场景模块</h1>
        <p>兰考泡桐示范村 · 三维重建 / 空间联动 / 产业资源 / 智能漫游</p>
      </div>
      <div class="header-time">
        <span class="meta-label">当前时间</span>
        <strong id="currentTime">--</strong>
      </div>
    </header>

    <main class="main-layout">
      <aside class="left-panel panel">
        <section class="panel-section overview-section">
          <div class="section-head">
            <h2>村庄三维资产概览</h2>
          </div>
          <div class="overview-grid">
            <article class="mini-stat"><span>实景建筑</span><strong>342</strong><small>栋</small></article>
            <article class="mini-stat"><span>泡桐林区</span><strong>1,250</strong><small>亩</small></article>
            <article class="mini-stat"><span>乐器工坊</span><strong>15</strong><small>家</small></article>
            <article class="mini-stat"><span>道路网络</span><strong>12.5</strong><small>km</small></article>
          </div>
        </section>

        <section class="panel-section layer-section">
          <div class="section-head">
            <h2>全要素图层控制</h2>
          </div>
          <div class="layer-scroll scroll-region">
            <label class="layer-toggle">
              <input type="checkbox" id="layerBuilding" value="buildingLayer" checked />
              <div class="toggle-track"><div class="toggle-thumb"></div></div>
              <span>建筑轮廓模型 (白膜)</span>
            </label>
            <label class="layer-toggle">
              <input type="checkbox" id="layerRoad" value="roadLayer" checked />
              <div class="toggle-track"><div class="toggle-thumb"></div></div>
              <span>路网与硬化面</span>
            </label>
            <label class="layer-toggle">
              <input type="checkbox" id="layerWater" value="waterLayer" checked />
              <div class="toggle-track"><div class="toggle-thumb"></div></div>
              <span>水系与沟渠</span>
            </label>
            <label class="layer-toggle">
              <input type="checkbox" id="layerTree" value="treeLayer" checked />
              <div class="toggle-track"><div class="toggle-thumb"></div></div>
              <span>特色泡桐林</span>
            </label>
            <label class="layer-toggle">
              <input type="checkbox" id="layerWorkshop" value="workshopLayer" checked />
              <div class="toggle-track"><div class="toggle-thumb"></div></div>
              <span>民族乐器工坊</span>
            </label>
            <label class="layer-toggle">
              <input type="checkbox" id="layerIssue" value="issueLayer" checked />
              <div class="toggle-track"><div class="toggle-thumb"></div></div>
              <span class="text-warn">治理问题标绘</span>
            </label>
          </div>
        </section>
      </aside>

      <section class="center-panel panel">
        <div class="map-toolbar">
          <button class="scene-btn active" data-mode="white" type="button">三维白膜</button>
          <button class="scene-btn" data-mode="photo" type="button">倾斜摄影实景</button>
          <button class="scene-btn" data-mode="lidar" type="button">激光雷达点云</button>
        </div>
        <div class="map-wrap">
          <div id="cesiumContainer"></div>
          <div class="roam-tip" id="roamTip">当前视角：全村鸟瞰</div>
        </div>
      </section>

      <aside class="right-panel panel">
        <section class="panel-section roam-section">
          <div class="section-head">
            <h2>视点智能漫游</h2>
          </div>
          <div class="roam-list">
            <button class="roam-item" data-target="center">
              <i class="icon">◎</i>
              <div class="roam-info">
                <h3>村委会广场</h3>
                <p>行政与治理中心</p>
              </div>
            </button>
            <button class="roam-item" data-target="forest">
              <i class="icon">🌲</i>
              <div class="roam-info">
                <h3>徐场村泡桐林</h3>
                <p>生态资源与原材料产地</p>
              </div>
            </button>
            <button class="roam-item" data-target="industry">
              <i class="icon">🎸</i>
              <div class="roam-info">
                <h3>古琴制作工坊集群</h3>
                <p>特色民族乐器产业链</p>
              </div>
            </button>
          </div>
        </section>

        <section class="panel-section radar-section">
          <div class="section-head">
            <h2>“三生”空间评价模型</h2>
          </div>
          <div class="radar-container">
            <canvas id="radarChart"></canvas>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script src="https://www.supermapol.com/earth/Build/Cesium/Cesium.js"></script>
  <script>
// Inlined from js/twin.js
// twin.js
const state = {
  mode: 'white', // white, photo, lidar
};

const dom = {
  currentTime: document.getElementById("currentTime"),
  radar: document.getElementById("radarChart"),
  roamTip: document.getElementById("roamTip")
};

let viewer = null;
let scene = null;

function init() {
  initClock();
  
  // 使用 try...catch 捕获 WebGL 崩溃，防止它“连累”其他 UI 组件
  try {
    initSuperMap3D(); 
  } catch (error) {
    console.error("SuperMap 3D 引擎初始化被远控环境拦截，但不影响 UI 渲染：", error);
    
    // 顺便把左上角的引擎状态改成飘红报错，显得我们做得很细节
    const statusEl = document.getElementById("runStatus");
    statusEl.textContent = "WebGL 环境受限";
    statusEl.style.color = "var(--type-env)"; // 变成红色
    statusEl.style.textShadow = "none";
  }

  // 现在即使 3D 崩了，下面的事件和图表也一定能正常加载了！
  initEvents();     
  drawRadarChart(); 
  
  window.addEventListener('resize', drawRadarChart);
}

function initClock() {
  const update = () => {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    dom.currentTime.textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };
  update(); setInterval(update, 1000);
}

// ==========================================
// SuperMap iClient3D for WebGL 核心逻辑
// ==========================================
function initSuperMap3D() {
  // 1. 初始化 Cesium Viewer，关闭多余自带控件
  viewer = new Cesium.Viewer('cesiumContainer', {
    infoBox: false,
    selectionIndicator: false,
    navigation: false,
    animation: false,
    timeline: false,
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    // contextOptions: {
    //   webgl: { preserveDrawingBuffer: true } // 允许截图/高性能抗锯齿
    // }
  });

  scene = viewer.scene;
  
  // 开启地下透明、光照等基础设置
  scene.globe.depthTestAgainstTerrain = true;
  
  // 2. 加载 iServer 发布的 S3M 三维服务 (这里用注释写出真实项目如何加载)
  /*
  const S3M_URL = "http://<你的iServer地址>/rest/realspace/datas/LankaoVillage/config";
  const promise = scene.open(S3M_URL);
  
  Cesium.when(promise, function(layers) {
    // 设置相机飞向目标村庄
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(114.8172, 34.8248, 800.0),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-45),
        roll: 0.0
      }
    });
  });
  */

  // 【演示用】因为没有你真实的 iServer 服务，先直接飞到兰考县大概位置看卫星底图
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(114.81, 34.82, 3000.0),
    orientation: {
      heading: Cesium.Math.toRadians(0),
      pitch: Cesium.Math.toRadians(-45),
      roll: 0.0
    }
  });
}

function initEvents() {
  // 1. 三维模式切换 (白膜 / 倾斜摄影 / 激光雷达)
  document.querySelectorAll(".scene-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".scene-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.mode = btn.dataset.mode;
      
      // 在 SuperMap 里，通常通过控制不同 S3M 图层的 visible 属性来实现模式切换
      // 例如：
      // const whiteLayer = scene.layers.find("WhiteModel");
      // const photoLayer = scene.layers.find("ObliquePhotography");
      // if (state.mode === 'white') { whiteLayer.visible = true; photoLayer.visible = false; }
      
      dom.roamTip.textContent = `已切换渲染模式：${btn.textContent}`;
    });
  });

  // 2. 全要素图层控制 (Checkbox)
  document.querySelectorAll(".layer-toggle input").forEach(input => {
    input.addEventListener("change", (e) => {
      const layerName = e.target.value;
      const isVisible = e.target.checked;
      
      // 调用 SuperMap API 控制图层显隐
      if (scene && scene.layers) {
        const layer = scene.layers.find(layerName);
        if (layer) {
          layer.visible = isVisible;
        }
      }
      console.log(`图层 [${layerName}] 显隐状态: ${isVisible}`);
    });
  });

  // 3. 视点智能漫游 (Camera FlyTo)
  const roams = {
    'center': { lon: 114.8172, lat: 34.8248, height: 150, heading: 0, pitch: -30, name: '村委会广场' },
    'forest': { lon: 114.8210, lat: 34.8290, height: 200, heading: 45, pitch: -45, name: '徐场村泡桐林' },
    'industry': { lon: 114.8120, lat: 34.8210, height: 120, heading: -30, pitch: -20, name: '古琴制作工坊集群' }
  };

  document.querySelectorAll(".roam-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = roams[btn.dataset.target];
      dom.roamTip.textContent = `漫游至：${target.name}`;
      dom.roamTip.style.borderColor = "#f4b44b";
      setTimeout(() => dom.roamTip.style.borderColor = "var(--brand-cyan)", 1000);

      // SuperMap Camera 平滑飞行 API
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(target.lon, target.lat, target.height),
        orientation: {
          heading: Cesium.Math.toRadians(target.heading),
          pitch: Cesium.Math.toRadians(target.pitch),
          roll: 0.0
        },
        duration: 2.0 // 飞行时长 2 秒
      });
    });
  });
}


// ----------------------------------------------------------------
// 三生空间评价 - 雷达图 
// ----------------------------------------------------------------
function drawRadarChart() {
  const canvas = dom.radar;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = rect.width, h = rect.height;
  if(w === 0) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2 + 10;
  const radius = Math.min(w, h) / 2 - 30;
  
  // ★ 这里修改为 3 个边！
  const sides = 3; 
  // ★ 严格对应三生指标
  const labels = ["生产空间", "生活空间", "生态空间"]; 
  // ★ 对应的数据 (分别对应 生产、生活、生态 的得分)
  const data = [0.85, 0.75, 0.92]; 

  // 1. 绘制底部的同心三角形网格
  for (let step = 1; step <= 4; step++) {
    const r = radius * (step / 4);
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = "rgba(53, 208, 198, 0.2)";
    ctx.stroke();
  }

  // 2. 绘制3条辐射轴线和标签
  ctx.fillStyle = "#9ab3aa";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let i = 0; i < sides; i++) {
    const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
    ctx.strokeStyle = "rgba(53, 208, 198, 0.3)";
    ctx.stroke();

    const lx = cx + Math.cos(angle) * (radius + 20);
    const ly = cy + Math.sin(angle) * (radius + 15);
    ctx.fillText(labels[i], lx, ly);
  }

  // 3. 绘制中间的数据填充区域 (三角形)
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
    const x = cx + Math.cos(angle) * (radius * data[i]);
    const y = cy + Math.sin(angle) * (radius * data[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(53, 208, 198, 0.3)";
  ctx.fill();
  ctx.strokeStyle = "#35d0c6";
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 4. 绘制3个数据端点的发光圆点
  for (let i = 0; i < sides; i++) {
    const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
    const x = cx + Math.cos(angle) * (radius * data[i]);
    const y = cy + Math.sin(angle) * (radius * data[i]);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#35d0c6";
    ctx.fill();
  }
}
init();
  </script>
