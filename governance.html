<!-- governance.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>乡村治理模块</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
/* Inlined from css/governance.css */
/* css/governance.css */
:root {
  --bg-0: #080d0d;
  --bg-1: #0d1413;
  --panel: rgba(16, 24, 23, 0.58);
  --panel-2: rgba(16, 24, 23, 0.74);
  --line: rgba(181, 224, 212, 0.14);
  --line-soft: rgba(181, 224, 212, 0.08);
  --text: #e8f1ee;
  --text-soft: #9ab3aa;
  --brand-cyan: #35d0c6;
  --brand-green: #70d27b;
  --type-env: #e56b5d;
  --type-base: #f4b44b;
  --type-space: #35d0c6;
  --type-safe: #70d27b;
  --status-pending: #f4b44b;
  --status-assigned: #35d0c6;
  --status-processing: #70d27b;
  --status-done: #8f9f97;
  --urgent-high: #e56b5d;
  --radius: 10px;
  --radius-sm: 8px;
  --shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background:
    radial-gradient(100% 90% at 50% 0%, rgba(53, 208, 198, 0.12), transparent 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
}

.governance-app {
  width: 100vw;
  height: 100vh;
  padding: 12px 14px;
  display: grid;
  grid-template-rows: 72px minmax(0, 1fr) 200px; /* 减小头部和底部的固定高度 */
  gap: 10px;
}

.panel {
  min-height: 0;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: var(--shadow);
}

.top-header {
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel-2);
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr) 280px;
  align-items: center;
  padding: 0 16px;
}

.header-title { text-align: center; }
.header-title h1 { margin: 0; font-size: clamp(22px, 1.65vw, 30px); font-weight: 600; }
.header-title p { margin: 6px 0 0; color: var(--text-soft); font-size: 12px; }

.header-meta, .header-time { display: grid; gap: 5px; }
.header-time { justify-items: end; }
.meta-label { font-size: 12px; color: var(--text-soft); }
.header-meta strong, .header-time strong { font-size: 14px; font-weight: 600; }

.main-layout {
  min-height: 0;
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr) 360px;
  gap: 10px;
}

.left-panel, .right-panel, .center-panel {
  min-height: 0;
  display: grid;
  gap: 10px;
  padding: 10px;
}

.left-panel { grid-template-rows: auto minmax(0, 1fr); }
.right-panel { grid-template-rows: minmax(0, 1fr) minmax(0, 1.2fr) auto; }
.center-panel {
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
}

.panel-section {
  min-height: 0;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.02);
  display: grid;
  grid-template-rows: 40px minmax(0, 1fr);
}

.action-section {
  grid-template-rows: 40px auto;
  padding-bottom: 10px;
}

.section-head {
  height: 40px;
  min-height: 0;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
}

.section-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
.section-head span { font-size: 12px; color: var(--text-soft); }

.overview-section { padding-bottom: 10px; }
.overview-grid {
  min-height: 0;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)); /* 改为一行三个 */
  gap: 6px; /* 稍微缩小间距 */
}

.mini-stat {
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.025);
  padding: 8px;
  transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
}
.mini-stat:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.045);
  border-color: rgba(181, 224, 212, 0.28);
}
.mini-stat span { font-size: 12px; color: var(--text-soft); }
.mini-stat strong { display: block; margin-top: 6px; font-size: 22px; font-weight: 650; }
.mini-stat.urgent strong { color: var(--urgent-high); }

.filter-scroll, .latest-scroll, .detail-scroll {
  min-height: 0;
  overflow: auto;
  padding: 10px;
}

.filter-group { margin-bottom: 8px; }
.filter-group label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-soft); }
.filter-group select, .filter-group input {
  width: 100%;
  height: 28px; /* 降低高度 */
  border: 1px solid var(--line);
  border-radius: 7px;
  background: rgba(9, 16, 15, 0.8);
  color: var(--text);
  font-size: 12px;
  padding: 0 10px;
  outline: none;
}
.filter-group select:focus, .filter-group input:focus { border-color: rgba(53, 208, 198, 0.5); }

.tiny-btn, .export-btn, .layer-btn, .status-btn {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
}
.tiny-btn:hover, .export-btn:hover, .layer-btn:hover, .status-btn:hover {
  transform: translateY(-1px);
  border-color: rgba(181, 224, 212, 0.35);
  background: rgba(255, 255, 255, 0.06);
}
.tiny-btn { height: 28px; padding: 0 10px; }

.map-toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 2px 8px; }
.layer-btn { height: 32px; padding: 0 14px; }
.layer-btn.active {
  border-color: rgba(53, 208, 198, 0.55);
  background: rgba(53, 208, 198, 0.16);
}

.map-wrap {
  min-height: 0;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
}
#governanceMap, #fallbackMap {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#fallbackMap { display: none; background: #0e1515; }

.map-legend {
  min-height: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 8px 2px 0;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-soft);
}
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }

.latest-list { display: grid; gap: 8px; padding-bottom: 6px; }

.issue-item {
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.025);
  padding: 6px 8px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px;
  cursor: pointer;
  transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
}
.issue-item:hover {
  transform: translateY(-2px);
  border-color: rgba(181, 224, 212, 0.3);
  background: rgba(255, 255, 255, 0.055);
}
.issue-item.active {
  border-color: rgba(53, 208, 198, 0.58);
  background: rgba(53, 208, 198, 0.13);
}
.issue-item h3 { margin: 0; font-size: 12px; font-weight: 600; }
.issue-item p {
  margin-top: 2px;
  color: var(--text-soft);
  font-size: 12px;
  line-height: 1.3;
  grid-column: 1 / -1;
}

.pill {
  justify-self: end;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 11px;
  border: 1px solid transparent;
}
.pill-urgency-high { color: var(--urgent-high); border-color: rgba(229,107,93,0.35); background: rgba(229,107,93,0.1); }
.pill-urgency-medium { color: var(--status-pending); border-color: rgba(244,180,75,0.35); background: rgba(244,180,75,0.08); }
.pill-urgency-low { color: var(--status-done); border-color: rgba(143,159,151,0.35); background: rgba(143,159,151,0.08); }
.status-badge { font-size: 11px; color: var(--text-soft); }

.problem-detail { display: grid; gap: 8px; font-size: 12px; }
.detail-photo {
  display: none;
  width: 100%;
  height: 90px; /* 大幅减小图片占用的高度，因为可以点击查看大图 */
  margin-bottom: 4px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid var(--line-soft);
  background: #111716;
}
.detail-grid {
  display: grid;
  grid-template-columns: 70px 1fr; /* 左侧标签宽度再缩窄一点 */
  gap: 4px 6px; /* 压缩上下左右间距 */
  font-size: 11px; /* 稍微缩小字号，让一行能显示更多字 */
}
.detail-grid dt { margin: 0; color: var(--text-soft); }
.detail-grid dd { margin: 0; }

.status-btns {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  padding: 10px 10px 0;
}
.status-btn { height: 32px; }
.status-btn.active {
  border-color: rgba(53, 208, 198, 0.5);
  background: rgba(53, 208, 198, 0.15);
}

.extra-actions {
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.export-btn {
  grid-column: 1 / -1;
  height: 34px;
  border-color: rgba(53, 208, 198, 0.55);
  background: rgba(53, 208, 198, 0.14);
}

.charts-layout {
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.chart-card {
  min-height: 0;
  display: grid;
  grid-template-rows: 40px minmax(0, 1fr);
  overflow: hidden;
}
.chart-content { min-height: 0; padding: 10px; }

.village-bars { display: grid; gap: 7px; }
.village-bar-row {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr) 36px;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.village-bar-track {
  height: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}
.village-bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-cyan), var(--brand-green));
}

#hotspotChart {
  width: 100%;
  height: 100%;
  display: block;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background:
    radial-gradient(circle at 15% 18%, rgba(53,208,198,0.12), transparent 30%),
    radial-gradient(circle at 82% 70%, rgba(112,210,123,0.1), transparent 35%),
    rgba(11, 18, 17, 0.72);
}

.status-chart {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: 128px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
}
.status-donut {
  width: 122px;
  height: 122px;
  border-radius: 50%;
  position: relative;
  border: 1px solid var(--line-soft);
}
.status-donut::after {
  content: attr(data-rate);
  position: absolute;
  inset: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(11, 18, 17, 0.95);
  border: 1px solid var(--line-soft);
  color: var(--text-soft);
  font-size: 13px;
}
.status-legend { display: grid; gap: 8px; }
.status-legend-row {
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr) 28px;
  gap: 8px;
  align-items: center;
  font-size: 12px;
  color: var(--text-soft);
}
.status-track {
  height: 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
}
.status-track i {
  display: block;
  height: 100%;
  border-radius: 999px;
}

.toast {
  position: fixed;
  right: 16px;
  bottom: 16px;
  min-width: 180px;
  max-width: 300px;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid rgba(53, 208, 198, 0.32);
  background: rgba(14, 23, 22, 0.92);
  color: var(--text);
  box-shadow: var(--shadow);
  font-size: 12px;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

.leaflet-control-attribution { display: none; }
.leaflet-pane { filter: brightness(0.8) saturate(0.85) contrast(0.95); }

/* 仅允许滚动区域定制滚动条 */
.scroll-region::-webkit-scrollbar { width: 6px; }
.scroll-region::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 999px; }
.scroll-region::-webkit-scrollbar-thumb { background: rgba(150, 175, 167, 0.6); border-radius: 999px; }
.scroll-region { scrollbar-width: thin; scrollbar-color: rgba(150, 175, 167, 0.6) rgba(255, 255, 255, 0.05); }

@media (max-width: 1440px) {
  .governance-app { padding: 10px 12px; gap: 8px; grid-template-rows: 78px minmax(0, 1fr) 206px; }
  .main-layout { grid-template-columns: 286px minmax(0, 1fr) 320px; gap: 8px; }
  .top-header { grid-template-columns: 230px minmax(0, 1fr) 230px; padding: 0 12px; }
}

@media (max-width: 1180px) {
  .governance-app { grid-template-rows: 74px minmax(0, 1fr) 220px; }
  .main-layout {
    grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  }
  .center-panel { grid-column: 1; grid-row: 1 / 3; }
  .left-panel { grid-column: 2; grid-row: 1; }
  .right-panel { /* 让“列表”和“详情”对半分，或者让详情自适应内容 */
  grid-template-rows: 1fr 1.5fr auto; }
}

@media (max-width: 900px) {
  .governance-app { grid-template-rows: 92px minmax(0, 1fr) 310px; padding: 8px; }
  .top-header {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    gap: 4px;
    padding: 8px 10px;
  }
  .header-title { text-align: left; }
  .header-title h1 { font-size: 22px; }
  .header-time { justify-items: start; }

  .main-layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: clamp(360px, 55vh, 620px) minmax(0, 1fr) minmax(0, 1fr);
  }
  .center-panel { grid-column: 1; grid-row: 1; }
  .left-panel { grid-column: 1; grid-row: 2; }
  .right-panel { grid-column: 1; grid-row: 3; }

  .charts-layout { grid-template-columns: 1fr; gap: 8px; }
  .status-chart { grid-template-columns: 110px minmax(0, 1fr); }
  .status-donut { width: 104px; height: 104px; }
  .status-donut::after { inset: 20px; }
}

  </style>
</head>
<body>
  <div class="governance-app">
    <header class="top-header">
      <div class="header-meta">
        <span class="meta-label">模块运行状态</span>
        <strong id="runStatus">正常运行</strong>
      </div>
      <div class="header-title">
        <h1>乡村治理闭环处置模块</h1>
        <p>群众参与 / 空间落图 / 数据分析 / 闭环处置</p>
      </div>
      <div class="header-time">
        <span class="meta-label">当前时间</span>
        <strong id="currentTime">--</strong>
      </div>
    </header>

    <main class="main-layout">
      <aside class="left-panel panel">
        <section class="panel-section overview-section">
          <div class="section-head">
            <h2>处置总览</h2>
          </div>
          <div class="overview-grid">
            <article class="mini-stat"><span>问题总数</span><strong id="statTotal">0</strong></article>
            <article class="mini-stat"><span>待审核</span><strong id="statPending">0</strong></article>
            <article class="mini-stat"><span>处理中</span><strong id="statProcessing">0</strong></article>
            <article class="mini-stat"><span>已办结</span><strong id="statClosed">0</strong></article>
            <article class="mini-stat"><span>闭环处置率</span><strong id="statClosureRate">0%</strong></article>
            <article class="mini-stat urgent"><span>高紧急问题</span><strong id="statHighUrgent">0</strong></article>
          </div>
        </section>

        <section class="panel-section filter-section">
          <div class="section-head">
            <h2>筛选条件</h2>
            <button id="resetFilters" class="tiny-btn" type="button">重置</button>
          </div>
          <div class="filter-scroll scroll-region">
            <div class="filter-group">
              <label for="filterKeyword">属性查询（编号/描述）</label>
              <input id="filterKeyword" type="text" placeholder="输入关键词" />
            </div>
            <div class="filter-group">
              <label for="filterType">按问题类型筛选</label>
              <select id="filterType"></select>
            </div>
            <div class="filter-group">
              <label for="filterTown">按乡镇筛选</label>
              <select id="filterTown"></select>
            </div>
            <div class="filter-group">
              <label for="filterVillage">按村庄筛选</label>
              <select id="filterVillage"></select>
            </div>
            <div class="filter-group">
              <label for="filterTime">按时间筛选</label>
              <select id="filterTime">
                <option value="all">全部时间</option>
                <option value="7">近7天</option>
                <option value="30">近30天</option>
                <option value="90">近90天</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filterUrgency">按紧急程度筛选</label>
              <select id="filterUrgency">
                <option value="all">全部紧急程度</option>
                <option value="高">高</option>
                <option value="中">中</option>
                <option value="低">低</option>
              </select>
            </div>
          </div>
        </section>
      </aside>

      <section class="center-panel panel">
        <div class="map-toolbar">
          <button class="layer-btn active" data-layer="points" type="button">问题点</button>
          <button class="layer-btn" data-layer="hotspot" type="button">热点分析</button>
          <button class="layer-btn" data-layer="cluster" type="button">聚类分析</button>
          <button class="layer-btn" data-layer="status" type="button">处置状态</button>
        </div>
        <div class="map-wrap">
          <div id="governanceMap"></div>
          <canvas id="fallbackMap"></canvas>
        </div>
        <div class="map-legend" id="mapLegend"></div>
      </section>

      <aside class="right-panel panel">
        <section class="panel-section latest-section">
          <div class="section-head">
            <h2>最新上报问题</h2>
            <span id="latestCount">0条</span>
          </div>
          <div class="latest-scroll scroll-region">
            <div id="latestList" class="latest-list"></div>
          </div>
        </section>

        <section class="panel-section detail-section">
          <div class="section-head">
            <h2>当前问题详情</h2>
          </div>
          <div class="detail-scroll scroll-region">
            <div id="problemDetail" class="problem-detail"></div>
          </div>
        </section>

        <section class="panel-section action-section">
          <div class="section-head">
            <h2>状态更新</h2>
          </div>
          <div class="status-btns">
            <button class="status-btn" data-status="待审核" type="button">待审核</button>
            <button class="status-btn" data-status="已派单" type="button">已派单</button>
            <button class="status-btn" data-status="处理中" type="button">处理中</button>
            <button class="status-btn" data-status="已办结" type="button">已办结</button>
          </div>
          <div class="extra-actions">
            <button id="viewPhotoBtn" class="tiny-btn" type="button">查看照片</button>
            <button id="viewContactBtn" class="tiny-btn" type="button">查看联系方式</button>
            <button id="exportBtn" class="export-btn" type="button">导出问题清单</button>
          </div>
        </section>
      </aside>
    </main>

    <section class="charts-layout">
      <article class="chart-card panel">
        <div class="section-head"><h2>村庄问题分布图</h2></div>
        <div class="chart-content"><div id="villageBars" class="village-bars"></div></div>
      </article>
      <article class="chart-card panel">
        <div class="section-head"><h2>问题热点图</h2></div>
        <div class="chart-content"><canvas id="hotspotChart"></canvas></div>
      </article>
      <article class="chart-card panel">
        <div class="section-head"><h2>问题处置统计图</h2></div>
        <div class="chart-content">
          <div class="status-chart">
            <div id="statusDonut" class="status-donut"></div>
            <div id="statusLegend" class="status-legend"></div>
          </div>
        </div>
      </article>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://iclient.supermap.io/dist/leaflet/iclient-leaflet.min.js"></script>
  <script>
// Inlined from js/governance.js
// js/governance.js
const TYPE_COLORS = {
  "人居环境类": "#e56b5d",
  "基础设施类": "#f4b44b",
  "空间管控类": "#35d0c6",
  "安全风险类": "#70d27b"

const state = {
  layer: "points",
  selectedId: DATA[0].id,
  filters: {
    keyword: "",
    type: "all",
    town: "all",
    village: "all",
    time: "all",
    urgency: "all"
  }
}

let map = null
let markerLayer = null
let markerMap = new Map()
let toastTimer = null

const dom = {
  currentTime: document.getElementById("currentTime"),
  runStatus: document.getElementById("runStatus"),
  filterKeyword: document.getElementById("filterKeyword"),
  filterType: document.getElementById("filterType"),
  filterTown: document.getElementById("filterTown"),
  filterVillage: document.getElementById("filterVillage"),
  filterTime: document.getElementById("filterTime"),
  filterUrgency: document.getElementById("filterUrgency"),
  latestList: document.getElementById("latestList"),
  latestCount: document.getElementById("latestCount"),
  detail: document.getElementById("problemDetail"),
  mapLegend: document.getElementById("mapLegend"),
  fallbackMap: document.getElementById("fallbackMap"),
  statusDonut: document.getElementById("statusDonut"),
  statusLegend: document.getElementById("statusLegend"),
  villageBars: document.getElementById("villageBars"),
  hotspotChart: document.getElementById("hotspotChart"),
  toast: document.getElementById("toast")
}

function init() {
  initClock()
  initFilters()
  initEvents()
  initMap()
  renderAll()
}

function initClock() {
  updateClock()
  setInterval(updateClock, 1000)
}

function updateClock() {
  const d = new Date()
  const p = (n) => String(n).padStart(2, "0")
  dom.currentTime.textContent = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
}

function initFilters() {
  fillSelect(dom.filterType, ["all", ...new Set(DATA.map(d => d.type))], "全部问题类型")
  fillSelect(dom.filterTown, ["all", ...new Set(DATA.map(d => d.town))], "全部乡镇")
  fillVillageOptions()
}

function fillVillageOptions() {
  const town = state.filters.town
  const villages = town === "all"
    ? [...new Set(DATA.map(d => d.village))]
    : [...new Set(DATA.filter(d => d.town === town).map(d => d.village))]
  fillSelect(dom.filterVillage, ["all", ...villages], "全部村庄")
  dom.filterVillage.value = state.filters.village
  if (![...dom.filterVillage.options].some(o => o.value === state.filters.village)) {
    state.filters.village = "all"
    dom.filterVillage.value = "all"
  }
}

function fillSelect(selectEl, values, allLabel) {
  selectEl.innerHTML = ""
  values.forEach((v, idx) => {
    const op = document.createElement("option")
    op.value = v
    op.textContent = idx === 0 && v === "all" ? allLabel : v
    selectEl.appendChild(op)
  })
}

function initEvents() {
  dom.filterKeyword.addEventListener("input", (e) => {
    state.filters.keyword = e.target.value.trim()
    renderAll()
  })

  dom.filterType.addEventListener("change", (e) => {
    state.filters.type = e.target.value
    renderAll()
  })

  dom.filterTown.addEventListener("change", (e) => {
    state.filters.town = e.target.value
    fillVillageOptions()
    renderAll()
  })

  dom.filterVillage.addEventListener("change", (e) => {
    state.filters.village = e.target.value
    renderAll()
  })

  dom.filterTime.addEventListener("change", (e) => {
    state.filters.time = e.target.value
    renderAll()
  })

  dom.filterUrgency.addEventListener("change", (e) => {
    state.filters.urgency = e.target.value
    renderAll()
  })

  document.getElementById("resetFilters").addEventListener("click", () => {
    state.filters = { keyword: "", type: "all", town: "all", village: "all", time: "all", urgency: "all" }
    dom.filterKeyword.value = ""
    dom.filterType.value = "all"
    dom.filterTown.value = "all"
    fillVillageOptions()
    dom.filterVillage.value = "all"
    dom.filterTime.value = "all"
    dom.filterUrgency.value = "all"
    renderAll()
  })

  document.querySelectorAll(".layer-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.layer = btn.dataset.layer
      document.querySelectorAll(".layer-btn").forEach(b => b.classList.toggle("active", b === btn))
      renderMap(getFilteredData())
      renderLegend()
    })
  })

  document.querySelectorAll(".status-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = DATA.find(d => d.id === state.selectedId)
      if (!item) return
      item.status = btn.dataset.status
      renderAll()
      showToast(`状态已更新为：${item.status}`)
    })
  })

  document.getElementById("exportBtn").addEventListener("click", () => {
    showToast("问题清单已生成")
  })

  document.getElementById("viewPhotoBtn").addEventListener("click", () => {
    const item = DATA.find(d => d.id === state.selectedId)
    if (!item) return
    showToast(`已查看照片：${item.id}`)
  })

  document.getElementById("viewContactBtn").addEventListener("click", () => {
    const item = DATA.find(d => d.id === state.selectedId)
    if (!item) return
    showToast(`联系方式：${item.phone}`)
  })

  // 监听热点图容器的实际尺寸变化，确保获取到准确的宽高后再绘制
  const hotspotContainer = dom.hotspotChart.parentElement;
  const resizeObserver = new ResizeObserver(() => {
    // 使用 requestAnimationFrame 防止频繁触发导致卡顿
    requestAnimationFrame(() => {
      drawHotspotChart(getFilteredData());
      if (!window.L) drawFallbackMap(getFilteredData());
    });
  });
  resizeObserver.observe(hotspotContainer);
}

function getFilteredData() {
  const now = Date.now()
  const dayMs = 24 * 60 * 60 * 1000
  return DATA.filter(d => {
    if (state.filters.keyword) {
      const k = state.filters.keyword.toLowerCase()
      const hit = d.id.toLowerCase().includes(k) || d.desc.toLowerCase().includes(k)
      if (!hit) return false
    }
    if (state.filters.type !== "all" && d.type !== state.filters.type) return false
    if (state.filters.town !== "all" && d.town !== state.filters.town) return false
    if (state.filters.village !== "all" && d.village !== state.filters.village) return false
    if (state.filters.urgency !== "all" && d.urgency !== state.filters.urgency) return false
    if (state.filters.time !== "all") {
      const diff = now - new Date(d.time).getTime()
      if (diff > Number(state.filters.time) * dayMs) return false
    }
    return true
  })
}

function renderAll() {
  const rows = getFilteredData()
  if (!rows.some(r => r.id === state.selectedId)) {
    state.selectedId = rows.length ? rows[0].id : null
  }

  renderOverview(rows)
  renderLatest(rows)
  renderDetail()
  renderStatusButtons()
  renderLegend()
  renderMap(rows)
  renderVillageBars(rows)
  drawHotspotChart(rows)
  renderStatusChart(rows)
}

function renderOverview(rows) {
  const total = rows.length
  const pending = rows.filter(r => r.status === "待审核").length
  const processing = rows.filter(r => r.status === "处理中").length
  const closed = rows.filter(r => r.status === "已办结").length
  const high = rows.filter(r => r.urgency === "高").length
  const rate = total ? ((closed / total) * 100).toFixed(1) : "0.0"

  document.getElementById("statTotal").textContent = String(total)
  document.getElementById("statPending").textContent = String(pending)
  document.getElementById("statProcessing").textContent = String(processing)
  document.getElementById("statClosed").textContent = String(closed)
  document.getElementById("statClosureRate").textContent = `${rate}%`
  document.getElementById("statHighUrgent").textContent = String(high)
}

function renderLatest(rows) {
  const list = [...rows].sort((a, b) => new Date(b.time) - new Date(a.time))
  dom.latestCount.textContent = `${list.length}条`
  dom.latestList.innerHTML = ""

  list.forEach(item => {
    const card = document.createElement("article")
    card.className = `issue-item${item.id === state.selectedId ? " active" : ""}`
    card.addEventListener("click", () => {
      state.selectedId = item.id
      renderDetail()
      renderLatest(rows)
      highlightMapSelection()
    })

    const title = document.createElement("h3")
    title.textContent = `${item.type} / ${item.subtype}`

    const pill = document.createElement("span")
    const urgencyCls = item.urgency === "高" ? "pill-urgency-high" : item.urgency === "中" ? "pill-urgency-medium" : "pill-urgency-low"
    pill.className = `pill ${urgencyCls}`
    pill.textContent = item.urgency

    const desc = document.createElement("p")
    desc.textContent = item.desc

    const status = document.createElement("span")
    status.className = "status-badge"
    status.textContent = `状态：${item.status}`

    card.appendChild(title)
    card.appendChild(pill)
    card.appendChild(desc)
    card.appendChild(status)
    dom.latestList.appendChild(card)
  })
}

function renderDetail() {
  const item = DATA.find(d => d.id === state.selectedId)
  if (!item) {
    dom.detail.innerHTML = "<p>暂无数据</p>"
    return
  }

  const photoUrl = item.photo || buildPhoto(item)
  dom.detail.innerHTML = `
    <img class="detail-photo" src="${photoUrl}" alt="现场照片" />
    <dl class="detail-grid">
      <dt>问题编号</dt><dd>${item.id}</dd>
      <dt>问题类型</dt><dd>${item.type}</dd>
      <dt>问题子类型</dt><dd>${item.subtype}</dd>
      <dt>问题描述</dt><dd>${item.desc}</dd>
      <dt>联系人</dt><dd>${item.contact}</dd>
      <dt>联系方式</dt><dd>${item.phone}</dd>
      <dt>所属乡镇</dt><dd>${item.town}</dd>
      <dt>所属村庄</dt><dd>${item.village}</dd>
      <dt>上报时间</dt><dd>${formatTime(item.time)}</dd>
      <dt>紧急程度</dt><dd>${item.urgency}</dd>
      <dt>处理状态</dt><dd>${item.status}</dd>
      <dt>经纬度</dt><dd>${item.lon.toFixed(6)}, ${item.lat.toFixed(6)}</dd>
    </dl>
  `
}

function renderStatusButtons() {
  const item = DATA.find(d => d.id === state.selectedId)
  document.querySelectorAll(".status-btn").forEach(btn => {
    btn.classList.toggle("active", item && item.status === btn.dataset.status)
  })
}

function formatTime(iso) {
  const d = new Date(iso)
  const p = (n) => String(n).padStart(2, "0")
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`
}

function buildPhoto(item) {
  const color = TYPE_COLORS[item.type] || "#35d0c6"
  const txt = encodeURIComponent(`${item.subtype} / ${item.village}`)
  const svg = `
  <svg xmlns='http://www.w3.org/2000/svg' width='640' height='360'>
    <defs>
      <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0%' stop-color='${color}' stop-opacity='0.85'/>
        <stop offset='100%' stop-color='#1a2624' stop-opacity='1'/>
      </linearGradient>
    </defs>
    <rect width='100%' height='100%' fill='url(#g)'/>
    <rect x='18' y='18' width='604' height='324' fill='none' stroke='rgba(255,255,255,0.3)'/>
    <text x='28' y='58' fill='white' font-size='20' font-family='Arial'>乡村治理现场照片（模拟）</text>
    <text x='28' y='98' fill='white' font-size='16' font-family='Arial'>${txt}</text>
  </svg>`
  return `data:image/svg+xml;charset=UTF-8,${svg}`
}

function initMap() {
  if (!window.L) {
    document.getElementById("governanceMap").style.display = "none"
    dom.fallbackMap.style.display = "block"
    drawFallbackMap(getFilteredData())
    return
  }

  map = L.map("governanceMap", { zoomControl: false, attributionControl: false }).setView([34.82, 114.81], 10)
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map)
  markerLayer = L.layerGroup().addTo(map)
}

function renderMap(rows) {
  if (!window.L || !map || !markerLayer) {
    drawFallbackMap(rows)
    return
  }

  markerLayer.clearLayers()
  markerMap.clear()

  if (state.layer === "cluster") {
    renderCluster(rows)
  } else {
    rows.forEach(item => {
      if (state.layer === "hotspot") {
        L.circle([item.lat, item.lon], {
          radius: item.urgency === "高" ? 520 : item.urgency === "中" ? 380 : 260,
          stroke: false,
          fillOpacity: 0.14,
          fillColor: TYPE_COLORS[item.type]
        }).addTo(markerLayer)
      }

      const color = state.layer === "status" ? STATUS_COLORS[item.status] : TYPE_COLORS[item.type]
      const marker = L.circleMarker([item.lat, item.lon], {
        radius: item.id === state.selectedId ? 10 : 7,
        color: "#dbe7e2",
        weight: item.id === state.selectedId ? 2 : 1,
        fillColor: color,
        fillOpacity: 0.9
      })

      marker.on("click", () => {
        state.selectedId = item.id
        renderDetail()
        renderLatest(rows)
        renderStatusButtons()
        highlightMapSelection()
      })

      marker.bindPopup(`${item.id}<br>${item.subtype}<br>${item.status}`)
      marker.addTo(markerLayer)
      markerMap.set(item.id, marker)
    })
  }

  highlightMapSelection()
}

function renderCluster(rows) {
  const grid = new Map()
  rows.forEach(item => {
    const key = `${Math.round(item.lat * 60) / 60}_${Math.round(item.lon * 60) / 60}`
    if (!grid.has(key)) grid.set(key, [])
    grid.get(key).push(item)
  })

  grid.forEach(group => {
    const lat = group.reduce((s, n) => s + n.lat, 0) / group.length
    const lon = group.reduce((s, n) => s + n.lon, 0) / group.length
    const count = group.length
    const marker = L.circleMarker([lat, lon], {
      radius: 8 + count * 3,
      color: "#dbe7e2",
      weight: 1,
      fillColor: "#35d0c6",
      fillOpacity: 0.75
    })
    marker.bindTooltip(`聚类 ${count} 条`, { permanent: true, direction: "center", className: "cluster-tip" })
    marker.on("click", () => {
      state.selectedId = group[0].id
      renderDetail()
      renderLatest(rows)
      renderStatusButtons()
      map.flyTo([group[0].lat, group[0].lon], 12, { duration: 0.5 })
    })
    marker.addTo(markerLayer)
  })
}

function highlightMapSelection() {
  if (!window.L || !map) return
  markerMap.forEach((m, id) => {
    const selected = id === state.selectedId
    m.setStyle({ radius: selected ? 10 : 7, weight: selected ? 2 : 1 })
    if (selected) map.panTo(m.getLatLng(), { animate: true, duration: 0.4 })
  })
}

function renderLegend() {
  const sets = {
    points: [
      ["人居环境类", TYPE_COLORS["人居环境类"]],
      ["基础设施类", TYPE_COLORS["基础设施类"]],
      ["空间管控类", TYPE_COLORS["空间管控类"]],
      ["安全风险类", TYPE_COLORS["安全风险类"]]
    ],
    hotspot: [
      ["热点强", "#e56b5d"],
      ["热点中", "#f4b44b"],
      ["热点弱", "#70d27b"]
    ],
    cluster: [
      ["聚类问题点", "#35d0c6"]
    ],
    status: [
      ["待审核", STATUS_COLORS["待审核"]],
      ["已派单", STATUS_COLORS["已派单"]],
      ["处理中", STATUS_COLORS["处理中"]],
      ["已办结", STATUS_COLORS["已办结"]]
    ]
  }

  dom.mapLegend.innerHTML = sets[state.layer].map(([name, color]) => `
    <span class="legend-item"><i class="legend-dot" style="background:${color}"></i>${name}</span>
  `).join("")
}

function drawFallbackMap(rows) {
  const c = dom.fallbackMap
  const box = c.getBoundingClientRect()
  c.width = box.width || 800
  c.height = box.height || 500
  const ctx = c.getContext("2d")
  ctx.clearRect(0, 0, c.width, c.height)

  ctx.fillStyle = "#0d1616"
  ctx.fillRect(0, 0, c.width, c.height)

  ctx.strokeStyle = "rgba(53,208,198,0.18)"
  for (let x = 20; x < c.width; x += 40) {
    ctx.beginPath()
    ctx.moveTo(x, 0)
    ctx.lineTo(x, c.height)
    ctx.stroke()
  }
  for (let y = 20; y < c.height; y += 40) {
    ctx.beginPath()
    ctx.moveTo(0, y)
    ctx.lineTo(c.width, y)
    ctx.stroke()
  }

  rows.forEach((r) => {
    const x = ((r.lon - 114.68) / (115.00 - 114.68)) * c.width
    const y = c.height - ((r.lat - 34.72) / (34.92 - 34.72)) * c.height
    const color = state.layer === "status" ? STATUS_COLORS[r.status] : TYPE_COLORS[r.type]
    ctx.beginPath()
    ctx.fillStyle = color
    ctx.globalAlpha = state.layer === "hotspot" ? 0.25 : 0.95
    ctx.arc(x, y, r.id === state.selectedId ? 11 : 8, 0, Math.PI * 2)
    ctx.fill()
    ctx.globalAlpha = 1
  })
}

function renderVillageBars(rows) {
  const mapVillage = new Map()
  rows.forEach(r => mapVillage.set(r.village, (mapVillage.get(r.village) || 0) + 1))
  const arr = [...mapVillage.entries()].sort((a, b) => b[1] - a[1]).slice(0, 7)
  const max = arr.length ? arr[0][1] : 1

  dom.villageBars.innerHTML = arr.map(([name, v]) => `
    <div class="village-bar-row">
      <span>${name}</span>
      <div class="village-bar-track"><div class="village-bar-fill" style="width:${(v / max) * 100}%"></div></div>
      <b>${v}</b>
    </div>
  `).join("")
}

function drawHotspotChart(rows) {
  const canvas = dom.hotspotChart;
  
  // 直接获取 Canvas 元素经过 CSS 布局后真实的显示像素大小
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  // 避免在网格系统尚未计算完毕时绘制（防止长宽为0导致报错）
  if (width === 0 || height === 0) return;

  const dpr = window.devicePixelRatio || 1;

  // 仅仅修改内部画板的像素密度，千万不要去修改 canvas.style.width ！
  // CSS 里的 width: 100% 会完美锁死它的外观大小。
  canvas.width = width * dpr;
  canvas.height = height * dpr;

  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, width, height);

  rows.forEach((r) => {
    // 经纬度映射逻辑，根据获取到的真实 width 和 height 进行等比换算
    const x = ((r.lon - 114.68) / (115.00 - 114.68)) * width;
    const y = height - ((r.lat - 34.72) / (34.92 - 34.72)) * height;
    
    // 半径缩小，避免光晕混在一起
    const radius = r.urgency === "高" ? 20 : r.urgency === "中" ? 14 : 10; 
    
    // 实心渐变，让它像一个个小灯泡一样亮起来
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    const color = TYPE_COLORS[r.type];
    g.addColorStop(0, hexToRgba(color, 0.95));  // 中心高亮
    g.addColorStop(0.4, hexToRgba(color, 0.5)); // 中间柔和
    g.addColorStop(1, hexToRgba(color, 0.0));   // 边缘透明

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  });
}

function renderStatusChart(rows) {
  const counts = {
    "待审核": rows.filter(r => r.status === "待审核").length,
    "已派单": rows.filter(r => r.status === "已派单").length,
    "处理中": rows.filter(r => r.status === "处理中").length,
    "已办结": rows.filter(r => r.status === "已办结").length
  }

  const total = rows.length || 1
  const doneRate = ((counts["已办结"] / total) * 100).toFixed(1)
  dom.statusDonut.dataset.rate = `闭环 ${doneRate}%`

  const a = (counts["待审核"] / total) * 360
  const b = (counts["已派单"] / total) * 360 + a
  const c = (counts["处理中"] / total) * 360 + b

  dom.statusDonut.style.background = `
    conic-gradient(
      ${STATUS_COLORS["待审核"]} 0deg ${a}deg,
      ${STATUS_COLORS["已派单"]} ${a}deg ${b}deg,
      ${STATUS_COLORS["处理中"]} ${b}deg ${c}deg,
      ${STATUS_COLORS["已办结"]} ${c}deg 360deg
    )
  `

  dom.statusLegend.innerHTML = Object.keys(counts).map(k => {
    const pct = ((counts[k] / total) * 100).toFixed(0)
    return `
      <div class="status-legend-row">
        <span>${k}</span>
        <div class="status-track"><i style="width:${pct}%;background:${STATUS_COLORS[k]}"></i></div>
        <b>${counts[k]}</b>
      </div>
    `
  }).join("")
}

function hexToRgba(hex, alpha) {
  const m = hex.replace("#", "")
  const r = parseInt(m.substring(0, 2), 16)
  const g = parseInt(m.substring(2, 4), 16)
  const b = parseInt(m.substring(4, 6), 16)
  return `rgba(${r},${g},${b},${alpha})`
}

function showToast(msg) {
  dom.toast.textContent = msg
  dom.toast.classList.add("show")
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => dom.toast.classList.remove("show"), 1600)
}

init()

  </script>
